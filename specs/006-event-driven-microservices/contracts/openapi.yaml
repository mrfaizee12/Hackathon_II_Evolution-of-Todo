  "payload": {
    "task_id": "string",
    "updates": {
      "title": "string",
      "description": "string",
      "due_date": "datetime",
      "priority": "enum(low|medium|high|urgent)",
      "tags": ["string"],
      "status": "enum(pending|in-progress|completed|cancelled)",
      "recurrence_pattern": {
        "type": "enum(daily|weekly|monthly|yearly)",

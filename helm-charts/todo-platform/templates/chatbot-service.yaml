apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-platform.fullname" . }}-chatbot-service
  labels:
    {{- include "todo-platform.labels" . | nindent 4 }}
    app: chatbot-service
spec:
  replicas: {{ .Values.chatbotService.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-platform.selectorLabels" . | nindent 6 }}
      app: chatbot-service
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "chatbot-service"
        dapr.io/app-port: "8004"
        dapr.io/config: "dapr-config"
      labels:
        {{- include "todo-platform.selectorLabels" . | nindent 8 }}
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: "{{ .Values.chatbotService.image.repository }}:{{ .Values.chatbotService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chatbotService.image.pullPolicy }}
          ports:
            - containerPort: 8004
          env:
            - name: SERVICE_NAME
              value: "chatbot-service"
            - name: PORT
              value: "8004"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: database-url
            - name: EVENT_BUS_TYPE
              value: {{ .Values.eventBus.type | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: secret-key
            - name: ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: openrouter-api-key
          resources:
            {{- toYaml .Values.chatbotService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  labels:
    {{- include "todo-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.chatbotService.service.port }}
      targetPort: 8004
      protocol: TCP
      name: http
  selector:
    {{- include "todo-platform.selectorLabels" . | nindent 4 }}
    app: chatbot-service
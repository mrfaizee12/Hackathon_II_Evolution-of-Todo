apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-platform-network-policy
spec:
  podSelector:
    matchLabels:
      app: todo-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8001  # Todo Service port
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8002  # Recurring Engine port
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8003  # Reminder Service port
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8004  # Chatbot Service port
    - from:
        - podSelector:
            matchLabels:
              app: recurring-engine
      ports:
        - protocol: TCP
          port: 8001  # Todo Service port (for event callbacks)
    - from:
        - podSelector:
            matchLabels:
              app: reminder-service
      ports:
        - protocol: TCP
          port: 8001  # Todo Service port (for event callbacks)
    - from:
        - podSelector:
            matchLabels:
              app: chatbot-service
      ports:
        - protocol: TCP
          port: 8001  # Todo Service port (for event callbacks)
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: dapr-system
      ports:
        - protocol: TCP
          port: 50001  # Dapr gRPC port
        - protocol: TCP
          port: 3500   # Dapr HTTP port
    - to:
        - podSelector:
            matchLabels:
              app: todo-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: recurring-engine
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: reminder-service
      ports:
        - protocol: TCP
          port: 8003
    - to:
        - podSelector:
            matchLabels:
              app: chatbot-service
      ports:
        - protocol: TCP
          port: 8004
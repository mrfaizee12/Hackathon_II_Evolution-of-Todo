apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-platform.fullname" . }}-reminder-service
  labels:
    {{- include "todo-platform.labels" . | nindent 4 }}
    app: reminder-service
spec:
  replicas: {{ .Values.reminderService.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-platform.selectorLabels" . | nindent 6 }}
      app: reminder-service
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "reminder-service"
        dapr.io/app-port: "8003"
        dapr.io/config: "dapr-config"
      labels:
        {{- include "todo-platform.selectorLabels" . | nindent 8 }}
        app: reminder-service
    spec:
      containers:
        - name: reminder-service
          image: "{{ .Values.reminderService.image.repository }}:{{ .Values.reminderService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.reminderService.image.pullPolicy }}
          ports:
            - containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: "reminder-service"
            - name: PORT
              value: "8003"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: database-url
            - name: EVENT_BUS_TYPE
              value: {{ .Values.eventBus.type | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: secret-key
            - name: ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: openrouter-api-key
          resources:
            {{- toYaml .Values.reminderService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-service
  labels:
    {{- include "todo-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.reminderService.service.port }}
      targetPort: 8003
      protocol: TCP
      name: http
  selector:
    {{- include "todo-platform.selectorLabels" . | nindent 4 }}
    app: reminder-service
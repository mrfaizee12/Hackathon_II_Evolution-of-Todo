apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
type: Opaque
data:
  # These values should be base64 encoded when deployed
  # Example: echo -n 'your-secret-key' | base64
  database-url: ""  # Base64 encoded database URL
  secret-key: ""    # Base64 encoded secret key
  openrouter-api-key: ""  # Base64 encoded OpenRouter API key